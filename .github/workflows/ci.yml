name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  # Uçtan uca rol testi: gerçek API + MongoDB + derlenmiş arayüz + Chromium (firma, teknokent, platform yöneticisi)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    env:
      PORT: 4000
      TRUST_PROXY: 0
      APP_URL: http://127.0.0.1:4000
      CORS_ORIGINS: http://127.0.0.1:4000
      MONGODB_URI: mongodb://127.0.0.1:27017/teknoortak_e2e
      JWT_SECRET: e2e-secret-e2e-secret-e2e-secret-e2e
      REQUIRE_EMAIL_VERIFICATION: 'true'
      ENABLE_JOBS: 'false'
      EMBEDDING_SERVICE_URL: ''
      SEED_ADMIN_EMAIL: platform@teknoortak.test
      SEED_ADMIN_PASSWORD: Platform123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - name: Arayüzü derle
        working-directory: web
        run: npm ci && npm run build
      - name: Tarayıcıyı kur
        working-directory: web
        run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Örnek verileri yükle
        run: npm run seed:demo
      - name: Sunucuyu başlat
        run: |
          NODE_ENV=production nohup node src/server.js > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4000/health > /dev/null && exit 0; sleep 1; done
          cat api.log; exit 1
      - name: Rol testleri
        working-directory: web
        run: node e2e/roles.e2e.mjs
      - name: Sunucu günlüğü
        if: always()
        run: tail -n 200 api.log || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: web/e2e/artifacts/

  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: embedding-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Gerçek modelle uçtan uca duman testi: servisi başlat, Türkçe cümlelerde benzerlik sırasını doğrula
  embedding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: embedding-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Servisi başlat
        run: nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > emb.log 2>&1 &
      - name: Servisin açılmasını bekle
        run: |
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 3; done
          cat emb.log; exit 1
      - name: Anlamsal benzerlik kontrolü
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000
