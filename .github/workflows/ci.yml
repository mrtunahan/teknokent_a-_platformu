name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_MONGODB_URI: mongodb://127.0.0.1:27017

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  embedding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: embedding-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  # Gerçek modelle uçtan uca duman testi: servisi başlat, Türkçe cümlelerde benzerlik sırasını doğrula
  embedding-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: embedding-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements.txt
      - name: Servisi başlat
        run: nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > emb.log 2>&1 &
      - name: Servisin açılmasını bekle
        run: |
          for i in $(seq 1 100); do curl -sf http://127.0.0.1:8000/health && exit 0; sleep 3; done
          cat emb.log; exit 1
      - name: Anlamsal benzerlik kontrolü
        run: python3 scripts/smoke_test.py http://127.0.0.1:8000
